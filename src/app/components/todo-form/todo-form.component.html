<div class="p-4">
  <h2 class="text-xl font-bold mb-4 text-gray-800">
    {{ data.todo ? 'Modifier la tâche' : 'Nouvelle tâche' }}
  </h2>

  <form [formGroup]="todoForm" class="space-y-3">
    
    <!-- Titre -->
    <div class="form-field">
      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Titre *</mat-label>
        <input matInput formControlName="titre" placeholder="Titre de la tâche">
        <mat-error *ngIf="isFieldInvalid('titre')">
          {{ getFieldError('titre') }}
        </mat-error>
      </mat-form-field>
    </div>

    <!-- Personne (Autocomplete) -->
    <div class="form-field">
      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Personne assignée *</mat-label>
        <input type="text"
               matInput
               formControlName="person"
               [matAutocomplete]="auto">
        <mat-autocomplete #auto="matAutocomplete" [displayWith]="displayPerson">
          <mat-option *ngFor="let person of filteredPersons | async" [value]="person">
            <div class="flex flex-col py-1">
              <span class="font-medium text-sm">{{ person.name }}</span>
              <span class="text-xs text-gray-500">{{ person.email }}</span>
            </div>
          </mat-option>
        </mat-autocomplete>
        <mat-error *ngIf="isFieldInvalid('person')">
          Veuillez sélectionner une personne
        </mat-error>
      </mat-form-field>
    </div>

    <!-- Dates -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
      <div class="form-field">
        <mat-form-field appearance="outline" class="w-full">
          <mat-label>Date de début *</mat-label>
          <input matInput [matDatepicker]="startPicker" formControlName="startDate">
          <mat-datepicker-toggle matSuffix [for]="startPicker"></mat-datepicker-toggle>
          <mat-datepicker #startPicker></mat-datepicker>
        </mat-form-field>
      </div>

      <div class="form-field">
        <mat-form-field appearance="outline" class="w-full">
          <mat-label>Date de fin</mat-label>
          <input matInput [matDatepicker]="endPicker" formControlName="endDate">
          <mat-datepicker-toggle matSuffix [for]="endPicker"></mat-datepicker-toggle>
          <mat-datepicker #endPicker></mat-datepicker>
        </mat-form-field>
      </div>
    </div>

    <!-- Priorité -->
    <div class="form-field">
      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Priorité *</mat-label>
        <mat-select formControlName="priority">
          <mat-option *ngFor="let priority of priorities" [value]="priority">
            {{ priority }}
          </mat-option>
        </mat-select>
      </mat-form-field>
    </div>

    <!-- Labels -->
    <div class="form-field">
      <label class="block text-sm font-medium text-gray-700 mb-1">Labels</label>
      <div class="flex flex-wrap gap-2">
        <mat-checkbox *ngFor="let label of labels" 
                     (change)="onLabelChange(label, $event)"
                     [checked]="todoForm.get('labels')?.value?.includes(label)"
                     class="text-sm">
          {{ label }}
        </mat-checkbox>
      </div>
    </div>

    <!-- Description -->
    <div class="form-field">
      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Description</mat-label>
        <textarea matInput formControlName="description" rows="2" placeholder="Description..."></textarea>
      </mat-form-field>
    </div>

    <!-- Completed -->
    <div class="form-field">
      <mat-checkbox formControlName="completed" color="primary" class="text-sm">
        Tâche terminée
      </mat-checkbox>
    </div>
  </form>

  <!-- Actions -->
  <div class="flex justify-end gap-2 mt-4 pt-3 border-t">
    <button mat-stroked-button (click)="onCancel()" class="text-sm">
      Annuler
    </button>
    <button mat-raised-button color="primary" (click)="onSave()" [disabled]="!todoForm.valid" class="text-sm">
      {{ data.todo ? 'Modifier' : 'Créer' }}
    </button>
  </div>
</div>
